<body class="translate">
    <iframe id="background" src="background.html"></iframe>

        <!-- Input and Button -->
        <form action="/chat/">
            <input type="text" name="prompt" class="input-field" placeholder="Enter your query...">
            <button class="button">فتح الدردشة</button>
        </form>

        <!-- Footer -->
        <div class="footer">
            <p>&copy; 2026 G4F. All Rights Reserved.</p>

        </div>

        <div class="stream-widget">جارٍ التحميل...</div>
    </div>
    <script>
        const streamWidget = document.querySelector('.stream-widget');
        (async () => {
            await framework.connectToBackend();
            const randIdx = Math.floor(Math.random() * 12)
            if (randIdx < 3) {
                search = "xtekky/gpt4free releases";
            } else if (randIdx < 6) {
                search = "developer news";
            } else {
                const language = framework.getLanguage();
                search = (language == "de" ? "news in deutsch" : language == "en" ? "world news" : `news in ${language}`);
            }
            let summaryPrompt = "Present the news from the search results in a clear and organized markdown format.";
            summaryPrompt += "\nInclude a headline, a brief summary, key points, and one or more relevant images with proper attribution.";
            summaryPrompt += "\nEnsure the content is concise, well-structured, and visually appealing.";
            summaryPrompt += `\nResponse in language: ${framework.getLanguage()} (iso-code)`;
            const url = `${framework.backendUrl}/backend-api/v2/create?prompt=${summaryPrompt}&stream=1&web_search=${search}`;
            const response = await fetch(url, {
                method: 'GET'
            });
            const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
            let buffer = [];
            let text = "";
            while (true) {
                const { value, done } = await reader.read();
                if (done) {
                    break;
                }
                buffer.push(value);
                text = buffer.join("");
                streamWidget.innerText = text;
            }
            clearTimeout(scrollToBottom);
            if (text && text.indexOf('"error"') < 0) {
                streamWidget.classList.add('show');
                streamWidget.innerHTML = `${framework.markdown(framework.filterMarkdown(text, null, text))}`;
                streamWidget.scrollTop = "0px";
            }
        })();
        setTimeout(()=>{
            streamWidget.classList.add('show');
        }, 1000);
        let scrollToBottom = null;
        let scrollToBottomCallback = () => {
            streamWidget.scrollTop = streamWidget.scrollHeight;
            if (streamWidget.scrollHeight - streamWidget.scrollTop < 2 * streamWidget.scrollHeight) {
                scrollToBottom = setTimeout(scrollToBottomCallback, 1000);
            }
        };
        scrollToBottom = setTimeout(scrollToBottomCallback, 1000);
    </script>

<script data-g4f-locale-runtime="1">
(function () {
    "use strict";
    const locale = "ar";
    const supported = ["en","ar","bg","cs","da","de","el","es","et","fa","fi","fr","he","hi","hr","hu","id","it","ja","kk","ko","nb","nl","pl","pt","ro","ru","sk","sl","sq","sr","sv","th","tr","uk","ur","uz","vi","zh"];
    const match = location.pathname.match(/^\/([a-z]{2})(?:\/|$)/i);
    const opened = match && supported.includes(match[1].toLowerCase())
        ? match[1].toLowerCase()
        : String(document.documentElement.lang || locale || "en")
            .split(/[-_]/)[0].toLowerCase();
    const base = supported.includes(opened) ? opened : "en";
    const apply = () => {
        if (!window.framework) return false;
        try {
            if (framework.setSelectedLanguage) framework.setSelectedLanguage(base);
        } catch (e) { /* private mode */ }
        const cached = framework.globalTranslations && framework.globalTranslations[base];
        if (cached && cached.translations) {
            framework.translations = Object.assign({}, framework.translations, cached.translations);
            if (framework.translateElements) framework.translateElements();
        }
        if (base !== "en" && typeof framework.loadGlobalTranslations === "function") {
            framework.loadGlobalTranslations(base).then((entry) => {
                if (entry && entry.translations) {
                    framework.translations = Object.assign(
                        {}, framework.translations, entry.translations
                    );
                }
                if (framework.translateElements) framework.translateElements();
                if (typeof framework.translateAll === "function") framework.translateAll();
            }).catch(() => {});
        } else if (typeof framework.translateAll === "function") {
            framework.translateAll();
        }
        return true;
    };
    if (!apply()) {
        document.addEventListener("DOMContentLoaded", apply, { once: true });
        window.addEventListener("load", apply, { once: true });
    }
})();
</script>
