<body>
<div class="container">
<div id="topbar">
  <div class="block">
    <label>Provider:
      <select id="provider"><option disabled selected>Зареждане...</option></select>
    </label>
  </div>
  <div class="block">
    <label>Model:
    <select id="modelSelect"><option value="" disabled selected>Зареждане...</option></select>
  </label>
  </div>
  <div class="block">
      <label>API Key: <input type="text" id="apiKey" placeholder="Optional" /></label>
  </div>
</div>

<div id="chat"></div>

<form id="form">
  <input type="text" id="input" placeholder="Ask something..." autocomplete="off" />
  <button id="submit">Изпрати</button>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/jsencrypt/bin/jsencrypt.min.js"></script>
<script src="/dist/js/framework.js"></script>
<script type="module">
  import { loadProviders, providerLocalStorage, createClient }  from "/dist/js/providers.js";
  
  import { marked } from "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";

  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const providerSelect = document.getElementById('provider');
  const apiKeyInput = document.getElementById('apiKey');
  const modelSelect = document.getElementById('modelSelect');

  let client = null;
  let messages = [];

  // Set the initial height of the container to fit the viewport
  document.querySelector(".container").style.maxHeight = window.innerHeight + "px";

  providerSelect.innerHTML = '';
  for (const key of Object.keys(await loadProviders())) {
      providerSelect.appendChild(new Option(key, key));
  }

  async function initClient() {
    const provider = providerSelect.value;
    const apiKey = apiKeyInput.value.trim();
    const options = apiKey ? { apiKey } : {};
    client = await createClient(provider, options);
    await loadModels();
  }

  async function loadModels() {
    modelSelect.innerHTML = '<option disabled selected>Loading...</option>';
    try {
      const models = await client.models.list();
      modelSelect.innerHTML = '';
      models.forEach(model => {
        if (model.type && !["chat", "image", "text"].includes(model.type)) {
          return;
        }
        const opt = document.createElement('option');
        opt.value = model.id;
        opt.textContent = model.id + (model.type == "image" ? " 🎨" : "");
        if (model.type) {
          opt.dataset.type = model.type;
        }
        if (model.id === client.defaultModel) opt.selected = true;
        modelSelect.appendChild(opt);
      });
    } catch (err) {
      console.error('Model load failed:', err);
      modelSelect.innerHTML = "";
    }
  }

  providerSelect.addEventListener('change', initClient);
  apiKeyInput.addEventListener('change', initClient);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    // Get the full selected option element to access its data attributes.
    const selectedOption = modelSelect.options[modelSelect.selectedIndex];
    const selectedModel = selectedOption.value || client.defaultModel;
    const modelType = selectedOption.dataset.type || 'chat'; // Default to 'chat' if type is not specified

    addMessage('user', text);
    messages.push({ role: 'user', content: text });
    input.value = '';

    const assistantEl = document.createElement('div');
    assistantEl.className = 'message assistant';
    assistantEl.innerHTML = `<em>Generating with ${modelType} model...</em>`;
    chat.appendChild(assistantEl);
    chat.scrollTop = chat.scrollHeight;

    try {
      if (modelType === 'image') {
        const response = await client.images.generate({
          model: selectedModel,
          prompt: text,
        });
        
        const imageUrl = response.data[0].url;
        assistantEl.innerHTML = `<img src="${imageUrl}" alt="${text}" />`;
        messages.push({ role: 'assistant', content: `Image generated: ${imageUrl}` });

      } else {
        const stream = await client.chat.completions.create({
          model: selectedModel,
          messages,
          stream: true
        });

        let fullResponse = '';
        let isReasoning = false;
        for await (const chunk of stream) {
          let delta;
          if (chunk.choices && chunk.choices[0]?.delta?.reasoning) {
            delta = chunk.choices[0]?.delta?.reasoning;
            isReasoning = true;
          } else if (chunk.choices) {
            delta = chunk.choices[0]?.delta?.content || '';
            if (isReasoning) {
              isReasoning = false;
              delta = '\n\n---\n\n' + delta;
            }
          }
          if (!delta) continue; // Skip empty chunks
          fullResponse += delta;
          assistantEl.innerHTML = marked.parse(fullResponse);
          chat.scrollTop = chat.scrollHeight;
        }
        messages.push({ role: 'assistant', content: fullResponse });
      }
    } catch (err) {
      assistantEl.innerHTML = '<strong>Error:</strong> ' + err.message;
      console.error(err);
    }
  });

  function addMessage(role, content) {
    const el = document.createElement('div');
    el.className = 'message ' + role;
    el.innerHTML = role === 'user'
      ? `<div class="user">${content}</div>`
      : marked.parse(content);
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  await initClient();
</script>

<script data-g4f-locale-runtime="1">
(function () {
    "use strict";
    const locale = "bg";
    const supported = ["en","ar","bg","cs","da","de","el","es","et","fa","fi","fr","he","hi","hr","hu","id","it","ja","kk","ko","nb","nl","pl","pt","ro","ru","sk","sl","sq","sr","sv","th","tr","uk","ur","uz","vi","zh"];
    const match = location.pathname.match(/^\/([a-z]{2})(?:\/|$)/i);
    const opened = match && supported.includes(match[1].toLowerCase())
        ? match[1].toLowerCase()
        : String(document.documentElement.lang || locale || "en")
            .split(/[-_]/)[0].toLowerCase();
    const base = supported.includes(opened) ? opened : "en";
    const apply = () => {
        if (!window.framework) return false;
        try {
            if (framework.setSelectedLanguage) framework.setSelectedLanguage(base);
        } catch (e) { /* private mode */ }
        const cached = framework.globalTranslations && framework.globalTranslations[base];
        if (cached && cached.translations) {
            framework.translations = Object.assign({}, framework.translations, cached.translations);
            if (framework.translateElements) framework.translateElements();
        }
        if (base !== "en" && typeof framework.loadGlobalTranslations === "function") {
            framework.loadGlobalTranslations(base).then((entry) => {
                if (entry && entry.translations) {
                    framework.translations = Object.assign(
                        {}, framework.translations, entry.translations
                    );
                }
                if (framework.translateElements) framework.translateElements();
                if (typeof framework.translateAll === "function") framework.translateAll();
            }).catch(() => {});
        } else if (typeof framework.translateAll === "function") {
            framework.translateAll();
        }
        return true;
    };
    if (!apply()) {
        document.addEventListener("DOMContentLoaded", apply, { once: true });
        window.addEventListener("load", apply, { once: true });
    }
})();
</script>
