    <style>
        :root {
            --colour-1: #000000;
            --colour-2: #ccc;
            --colour-3: #e4d4ff;
            --colour-4: #f0f0f0;
            --colour-5: #181818;
            --colour-6: #242424;
            --accent: #8b3dff;
            --gradient: #1a1a1a;
            --background: #16101b;
            --size: 70vw;
            --top: 50%;
            --blur: 40px;
            --opacity: 0.6;
        }

        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap");

        /* Body and text color */
        body {
            background: var(--background);
            color: var(--colour-3);
            font-family: "Inter", sans-serif;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-weight: bold;
        }

        iframe {
            background: transparent;
            width: 100%;
            border: none;
        }

        #background {
            height: 100%;
            position: absolute;
            top: 0;
        }

        .hidden {
            display: none;
        }

        .stream-container {
            max-height: 0;
            transition: max-height 0.15s ease-out;
            color: var(--colour-5);
            overflow: scroll;
            text-align: left;
        }

        .stream-container.show {
            max-height: 100%;
            height: 100%;
            transition: max-height 0.25s ease-in;
            background: rgba(255,255,255,0.7);
            padding: 0 1rem;
        }

        .stream-container img {
            max-width: 320px;
            display: block;
        }

        .stream-container, .stream-widget {
            width: 100%;
            position: fixed;
            position: absolute;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000001;
            background-color: #fff;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
</head>
<body>
    <div class="stream-container"></div>
    <iframe class="stream-widget hidden"></iframe>
    <script>
        const streamWidget = document.querySelector('.stream-widget');
        const streamContainer = document.querySelector('.stream-container');
        const updateContent = async () => {
            await framework.connectToBackend();
            let prompt = window.location.hash.replace("#", "");
            prompt = prompt || `Generate a website (html) in language (${framework.getLanguage()}) for gpt4free (G4F)`;
            const response = await framework.query(prompt);
            const text = await response.text()
            if (text /*&& text.indexOf('"error"') < 0*/) {
                const html = filterMarkdown(text, "html");
                if (html) {
                    streamWidget.src = `data:text/html;charset=utf-8,${encodeURIComponent(html)}`;
                    streamContainer.classList.remove("show");
                    streamWidget.classList.remove('hidden');
                } else {
                    streamWidget.classList.add('hidden');
                    streamContainer.classList.add("show");
                    streamContainer.innerHTML = framework.markdown(framework.filterMarkdown(text, null, text));
                }
            }
        };
        window.addEventListener("hashchange", updateContent);
        updateContent();
    </script>

<script data-g4f-locale-runtime="1">
(function () {
    "use strict";
    const locale = "fa";
    const supported = ["en","ar","bg","cs","da","de","el","es","et","fa","fi","fr","he","hi","hr","hu","id","it","ja","kk","ko","nb","nl","pl","pt","ro","ru","sk","sl","sq","sr","sv","th","tr","uk","ur","uz","vi","zh"];
    const match = location.pathname.match(/^\/([a-z]{2})(?:\/|$)/i);
    const opened = match && supported.includes(match[1].toLowerCase())
        ? match[1].toLowerCase()
        : String(document.documentElement.lang || locale || "en")
            .split(/[-_]/)[0].toLowerCase();
    const base = supported.includes(opened) ? opened : "en";
    const apply = () => {
        if (!window.framework) return false;
        try {
            if (framework.setSelectedLanguage) framework.setSelectedLanguage(base);
        } catch (e) { /* private mode */ }
        const cached = framework.globalTranslations && framework.globalTranslations[base];
        if (cached && cached.translations) {
            framework.translations = Object.assign({}, framework.translations, cached.translations);
            if (framework.translateElements) framework.translateElements();
        }
        if (base !== "en" && typeof framework.loadGlobalTranslations === "function") {
            framework.loadGlobalTranslations(base).then((entry) => {
                if (entry && entry.translations) {
                    framework.translations = Object.assign(
                        {}, framework.translations, entry.translations
                    );
                }
                if (framework.translateElements) framework.translateElements();
                if (typeof framework.translateAll === "function") framework.translateAll();
            }).catch(() => {});
        } else if (typeof framework.translateAll === "function") {
            framework.translateAll();
        }
        return true;
    };
    if (!apply()) {
        document.addEventListener("DOMContentLoaded", apply, { once: true });
        window.addEventListener("load", apply, { once: true });
    }
})();
</script>
