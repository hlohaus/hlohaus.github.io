  <style>
    body, html {
      margin: 0; padding: 0; height: 100vh; overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
    }
    #app-selector {
      background: #222;
      color: white;
      padding: 10px;
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
    }
    #app-selector button {
      background: #444;
      border: none;
      color: white;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.3s;
    }
    #app-selector button:hover, #app-selector button.active {
      background: #08f;
    }
    #iframe-container {
      position: relative;
      flex: 1 1 auto;
      height: calc(100vh - 48px); /* selector height + padding approx */
      width: 100%;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1000; /* iframe always on top */
    }
  </style>

<body>
  <div id="app-selector" aria-label="Select app">
    <!-- buttons inserted by JS -->
  </div>
  <div id="iframe-container">
    <iframe id="app-frame" src="" scrolling="yes" title="G4F Dev App"></iframe>
  </div>

  <script>
    const apps = [

    { name: "Quote Generator", url: "quote_generator.html" },
    { name: "Random Password Generator", url: "random_password_generator.html" },
    { name: "Recipe Finder by Ingredients", url: "recipefinderbyingredients.html" },
    { name: "Simon Memory Game", url: "simon_memory_game.html" },

    { name: "Simple Poll Voting App", url: "simple_poll_voting_app.html" },
    { name: "Snake Game", url: "snake_game.html" },

    { name: "Unit Converter (Length, Weight, Temperature)", url: "unit_converter_(length,_weight,_temperature).html" },

    { name: "Voice Controlled Stopwatch", url: "voice-controlledstopwatch.html" },
    { name: "Workout Planner with Timer", url: "workoutplannerwithtimer.html" }
  ];


    const selector = document.getElementById('app-selector');
    const iframe = document.getElementById('app-frame');

    function setActiveButton(activeBtn) {
      [...selector.children].forEach(btn => btn.classList.remove('active'));
      activeBtn.classList.add('active');
    }

    function loadApp(url, btn) {
      iframe.src = url;
      setActiveButton(btn);
    }

    // Build buttons
    apps.forEach(({name, url}, idx) => {
      const btn = document.createElement('button');
      btn.textContent = name;
      btn.type = 'button';
      btn.title = name;
      btn.addEventListener('click', () => loadApp(url, btn));
      selector.appendChild(btn);
      // Load first app by default
      if (idx === 0) {
        loadApp(url, btn);
      }
    });
  </script>

<script data-g4f-locale-runtime="1">
(function () {
    "use strict";
    const locale = "fr";
    const supported = ["en","ar","bg","cs","da","de","el","es","et","fa","fi","fr","he","hi","hr","hu","id","it","ja","kk","ko","nb","nl","pl","pt","ro","ru","sk","sl","sq","sr","sv","th","tr","uk","ur","uz","vi","zh"];
    const match = location.pathname.match(/^\/([a-z]{2})(?:\/|$)/i);
    const opened = match && supported.includes(match[1].toLowerCase())
        ? match[1].toLowerCase()
        : String(document.documentElement.lang || locale || "en")
            .split(/[-_]/)[0].toLowerCase();
    const base = supported.includes(opened) ? opened : "en";
    const apply = () => {
        if (!window.framework) return false;
        try {
            if (framework.setSelectedLanguage) framework.setSelectedLanguage(base);
        } catch (e) { /* private mode */ }
        const cached = framework.globalTranslations && framework.globalTranslations[base];
        if (cached && cached.translations) {
            framework.translations = Object.assign({}, framework.translations, cached.translations);
            if (framework.translateElements) framework.translateElements();
        }
        if (base !== "en" && typeof framework.loadGlobalTranslations === "function") {
            framework.loadGlobalTranslations(base).then((entry) => {
                if (entry && entry.translations) {
                    framework.translations = Object.assign(
                        {}, framework.translations, entry.translations
                    );
                }
                if (framework.translateElements) framework.translateElements();
                if (typeof framework.translateAll === "function") framework.translateAll();
            }).catch(() => {});
        } else if (typeof framework.translateAll === "function") {
            framework.translateAll();
        }
        return true;
    };
    if (!apply()) {
        document.addEventListener("DOMContentLoaded", apply, { once: true });
        window.addEventListener("load", apply, { once: true });
    }
})();
</script>
