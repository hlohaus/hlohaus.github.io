  <meta charset="UTF-8" />

  <title>Random Password Generator</title>
  <style>
    /* Reset & base */
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: #333;
    }
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      padding: 2rem 2.5rem;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-weight: 700;
      text-align: center;
      color: #007acc;
    }
    .options {
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }
    .options label {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .options input[type="number"] {
      width: 100px;
      padding: 0.4rem 0.6rem;
      border: 1.5px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }
    .options input[type="number"]:focus {
      border-color: #007acc;
      outline: none;
    }

    /* Checkbox inputs styled for clarity */
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #007acc;
    }

    #generate {
      width: 100%;
      background-color: #007acc;
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 0;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 1rem;
      user-select: none;
    }
    #generate:hover:not(:disabled) {
      background-color: #005fa3;
    }
    #generate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.5rem;
    }
    #password {
      flex-grow: 1;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      background: #fafafa;
      user-select: all;
    }
    #password:focus {
      outline: none;
      border-color: #007acc;
      background: white;
    }
    #copy {
      background: #007acc;
      border: none;
      color: white;
      padding: 0 1rem;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
      user-select: none;
    }
    #copy:hover {
      background: #005fa3;
    }
    /* Responsive */
    @media (max-width: 440px) {
      .container {
        padding: 1.5rem 1.5rem;
        max-width: 100%;
      }
      .options input[type="number"] {
        width: 100%;
      }
    }

<body>
  <div class="container">
    <h1>Random Password Generator</h1>
    <div class="options">
      <label for="length">Password Length:</label>
      <input type="number" id="length" min="4" max="50" value="12" />
    </div>
    <div class="options">
      <label>
        <input type="checkbox" id="uppercase" checked /> Include Uppercase Letters
      </label>
    </div>
    <div class="options">
      <label>
        <input type="checkbox" id="lowercase" checked /> Include Lowercase Letters
      </label>
    </div>
    <div class="options">
      <label>
        <input type="checkbox" id="numbers" checked /> Include Numbers
      </label>
    </div>
    <div class="options">
      <label>
        <input type="checkbox" id="special" checked /> Include Special Characters
      </label>
    </div>
    <button id="generate">Generate Password</button>
    <div class="result">
      <input type="text" id="password" readonly />
      <button id="copy" title="Copy password to clipboard">📋 Copy</button>
    </div>
  </div>

  <script>
    (function() {
      const lengthInput = document.getElementById('length');
      const uppercaseCheckbox = document.getElementById('uppercase');
      const lowercaseCheckbox = document.getElementById('lowercase');
      const numbersCheckbox = document.getElementById('numbers');
      const specialCheckbox = document.getElementById('special');
      const generateBtn = document.getElementById('generate');
      const passwordOutput = document.getElementById('password');
      const copyBtn = document.getElementById('copy');

      const charSets = {
        uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lowercase: 'abcdefghijklmnopqrstuvwxyz',
        numbers: '0123456789',
        special: '!@#$%^&*()_+[]{}|;:,.<>?/~`-='
      };

      function generatePassword() {
        const length = parseInt(lengthInput.value, 10);
        if (isNaN(length) || length < 4 || length > 50) {
          alert('Password length must be between 4 and 50.');
          return '';
        }

        let availableChars = '';
        const selectedSets = [];

        if (uppercaseCheckbox.checked) {
          availableChars += charSets.uppercase;
          selectedSets.push(charSets.uppercase);
        }
        if (lowercaseCheckbox.checked) {
          availableChars += charSets.lowercase;
          selectedSets.push(charSets.lowercase);
        }
        if (numbersCheckbox.checked) {
          availableChars += charSets.numbers;
          selectedSets.push(charSets.numbers);
        }
        if (specialCheckbox.checked) {
          availableChars += charSets.special;
          selectedSets.push(charSets.special);
        }

        if (!availableChars) {
          alert('Please select at least one character type.');
          return '';
        }

        // Guarantee the password contains at least one character from each selected set
        let passwordChars = selectedSets.map(set => set.charAt(Math.floor(Math.random() * set.length)));

        // Fill the remaining length with random chars from all selected chars
        for (let i = passwordChars.length; i < length; i++) {
          passwordChars.push(availableChars.charAt(Math.floor(Math.random() * availableChars.length)));
        }

        // Shuffle the result to avoid predictable sequences
        for (let i = passwordChars.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [passwordChars[i], passwordChars[j]] = [passwordChars[j], passwordChars[i]];
        }

        return passwordChars.join('');
      }

      generateBtn.addEventListener('click', () => {
        const pwd = generatePassword();
        if (pwd) {
          passwordOutput.value = pwd;
          passwordOutput.focus();
          passwordOutput.select();
        }
      });

      copyBtn.addEventListener('click', () => {
        if (!passwordOutput.value) {
          alert('Nothing to copy! Generate a password first.');
          return;
        }
        // Use Clipboard API if available
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(passwordOutput.value).then(() => {
            alert('Password copied to clipboard!');
          }, () => {
            fallbackCopy();
          });
        } else {
          fallbackCopy();
        }

        function fallbackCopy() {
          passwordOutput.select();
          try {
            if (document.execCommand('copy')) {
              alert('Password copied to clipboard!');
            } else {
              alert('Failed to copy password.');
            }
          } catch (err) {
            alert('Failed to copy password.');
          }
        }
      });

      // Optional: Disable generate button if no checkbox is selected or invalid length
      function validateForm() {
        const length = parseInt(lengthInput.value, 10);
        const isLengthValid = !isNaN(length) && length >= 4 && length <= 50;
        const atLeastOneChecked = uppercaseCheckbox.checked || lowercaseCheckbox.checked || numbersCheckbox.checked || specialCheckbox.checked;
        generateBtn.disabled = !(isLengthValid && atLeastOneChecked);
      }

      // Validate on input changes
      lengthInput.addEventListener('input', validateForm);
      uppercaseCheckbox.addEventListener('change', validateForm);
      lowercaseCheckbox.addEventListener('change', validateForm);
      numbersCheckbox.addEventListener('change', validateForm);
      specialCheckbox.addEventListener('change', validateForm);

      // Initial validation state
      validateForm();
    })();
  </script>

<script data-g4f-locale-runtime="1">
(function () {
    "use strict";
    const locale = "ro";
    const supported = ["en","ar","bg","cs","da","de","el","es","et","fa","fi","fr","he","hi","hr","hu","id","it","ja","kk","ko","nb","nl","pl","pt","ro","ru","sk","sl","sq","sr","sv","th","tr","uk","ur","uz","vi","zh"];
    const match = location.pathname.match(/^\/([a-z]{2})(?:\/|$)/i);
    const opened = match && supported.includes(match[1].toLowerCase())
        ? match[1].toLowerCase()
        : String(document.documentElement.lang || locale || "en")
            .split(/[-_]/)[0].toLowerCase();
    const base = supported.includes(opened) ? opened : "en";
    const apply = () => {
        if (!window.framework) return false;
        try {
            if (framework.setSelectedLanguage) framework.setSelectedLanguage(base);
        } catch (e) { /* private mode */ }
        const cached = framework.globalTranslations && framework.globalTranslations[base];
        if (cached && cached.translations) {
            framework.translations = Object.assign({}, framework.translations, cached.translations);
            if (framework.translateElements) framework.translateElements();
        }
        if (base !== "en" && typeof framework.loadGlobalTranslations === "function") {
            framework.loadGlobalTranslations(base).then((entry) => {
                if (entry && entry.translations) {
                    framework.translations = Object.assign(
                        {}, framework.translations, entry.translations
                    );
                }
                if (framework.translateElements) framework.translateElements();
                if (typeof framework.translateAll === "function") framework.translateAll();
            }).catch(() => {});
        } else if (typeof framework.translateAll === "function") {
            framework.translateAll();
        }
        return true;
    };
    if (!apply()) {
        document.addEventListener("DOMContentLoaded", apply, { once: true });
        window.addEventListener("load", apply, { once: true });
    }
})();
</script>
