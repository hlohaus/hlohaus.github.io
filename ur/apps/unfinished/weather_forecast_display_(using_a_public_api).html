    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Weather Forecast</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Advanced Weather Forecast</h1>
            <div class="search-container">
                <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
                <button id="search-btn"><i class="fas fa-search"></i></button>
                <button id="location-btn" title="Use current location"><i class="fas fa-location-arrow"></i></button>
            </div>
            <div class="unit-toggle">
                <button id="celsius-btn" class="active">°C</button>
                <button id="fahrenheit-btn">°F</button>
            </div>
        </header>

        <main>
            <div class="current-weather">
                <div class="weather-info">
                    <h2 id="city-name">--</h2>
                    <div class="date-time" id="current-date">--</div>
                    <div class="temp" id="current-temp">--°</div>
                    <div class="description" id="weather-desc">--</div>
                </div>
                <div class="weather-icon">
                    <img id="weather-icon" src="https://openweathermap.org/img/wn/01d@2x.png" alt="Weather icon">
                </div>
                <div class="weather-details">
                    <div class="detail-item">
                        <i class="fas fa-temperature-high"></i>
                        <span>Feels Like</span>
                        <span id="feels-like">--°</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-tint"></i>
                        <span>Humidity</span>
                        <span id="humidity">--%</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-wind"></i>
                        <span>Wind</span>
                        <span id="wind-speed">-- km/h</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-compress-alt"></i>
                        <span>Pressure</span>
                        <span id="pressure">-- hPa</span>
                    </div>
                </div>
            </div>

            <div class="hourly-forecast">
                <h3>Hourly Forecast</h3>
                <div class="hourly-container" id="hourly-container">
                    <!-- Hourly items will be inserted here by JavaScript -->
                </div>
            </div>

            <div class="daily-forecast">
                <h3>5-Day Forecast</h3>
                <div class="daily-container" id="daily-container">
                    <!-- Daily forecast items will be inserted here by JavaScript -->
                </div>
            </div>

            <div class="additional-info">
                <div class="info-card sunrise">
                    <i class="fas fa-sun"></i>
                    <span>Sunrise</span>
                    <span id="sunrise">--:--</span>
                </div>
                <div class="info-card sunset">
                    <i class="fas fa-moon"></i>
                    <span>Sunset</span>
                    <span id="sunset">--:--</span>
                </div>
                <div class="info-card visibility">
                    <i class="fas fa-eye"></i>
                    <span>Visibility</span>
                    <span id="visibility">-- km</span>
                </div>
                <div class="info-card uv-index">
                    <i class="fas fa-sun"></i>
                    <span>UV Index</span>
                    <span id="uv-index">--</span>
                </div>
            </div>
        </main>

        <footer>
            <p>Data provided by <a href="https://openweathermap.org" target="_blank">OpenWeatherMap</a></p>
            <p id="last-updated">Last updated: --</p>
        </footer>
    </div>

    <div class="loading-overlay" id="loading-overlay">
        <div class="loader"></div>
    </div>

    <script src="script.js"></script>

<script data-g4f-locale-runtime="1">
(function () {
    "use strict";
    const locale = "ur";
    const supported = ["en","ar","bg","cs","da","de","el","es","et","fa","fi","fr","he","hi","hr","hu","id","it","ja","kk","ko","nb","nl","pl","pt","ro","ru","sk","sl","sq","sr","sv","th","tr","uk","ur","uz","vi","zh"];
    const match = location.pathname.match(/^\/([a-z]{2})(?:\/|$)/i);
    const opened = match && supported.includes(match[1].toLowerCase())
        ? match[1].toLowerCase()
        : String(document.documentElement.lang || locale || "en")
            .split(/[-_]/)[0].toLowerCase();
    const base = supported.includes(opened) ? opened : "en";
    const apply = () => {
        if (!window.framework) return false;
        try {
            if (framework.setSelectedLanguage) framework.setSelectedLanguage(base);
        } catch (e) { /* private mode */ }
        const cached = framework.globalTranslations && framework.globalTranslations[base];
        if (cached && cached.translations) {
            framework.translations = Object.assign({}, framework.translations, cached.translations);
            if (framework.translateElements) framework.translateElements();
        }
        if (base !== "en" && typeof framework.loadGlobalTranslations === "function") {
            framework.loadGlobalTranslations(base).then((entry) => {
                if (entry && entry.translations) {
                    framework.translations = Object.assign(
                        {}, framework.translations, entry.translations
                    );
                }
                if (framework.translateElements) framework.translateElements();
                if (typeof framework.translateAll === "function") framework.translateAll();
            }).catch(() => {});
        } else if (typeof framework.translateAll === "function") {
            framework.translateAll();
        }
        return true;
    };
    if (!apply()) {
        document.addEventListener("DOMContentLoaded", apply, { once: true });
        window.addEventListener("load", apply, { once: true });
    }
})();
</script>
